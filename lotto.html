<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #lottoNumbers {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>로또</h1>
    <button onclick="generateLottoNumbers()">번호</button>
    <div id="lottoNumbers"></div>

    <script>
        function generateLottoNumbers() {
            const numbers = new Set();

            while (numbers.size < 6) {
                const randomNumber = Math.floor(Math.random() * 45) + 1;
                numbers.add(randomNumber);
            }

            const sortedNumbers = Array.from(numbers).sort((a, b) => a - b);
            document.getElementById('lottoNumbers').innerText = "번호: " + sortedNumbers.join(', ');
        }
    </script>
</body>
</html>
